<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Andhra Pradesh Fact Check | ఏపీ నిజ నిర్ధారణ</title>
    <meta
      name="description"
      content="Andhra Pradesh Fact Check is an independent, no-login transparency platform. Every project, budget and commitment figure is taken from a government document and cited, in six languages."
    />
    <!--
      NO CANONICAL HERE, ON PURPOSE.
      NO og:url HERE EITHER, FOR THE SAME REASON.

      There used to be both, and both pointed at the homepage. Every route in
      this app is served from this one file, so /projects, /finances and every
      other page told Google "the real page is the homepage". Search Console
      confirmed it: User-declared canonical read https://apfactcheck.dheeco.com/
      on every URL inspected. Google obeys a canonical. It would have indexed one
      page and discarded the other eighteen as duplicates.

      A static file cannot know which route it is about to serve, so the tags are
      set at runtime instead, in src/lib/seo.js, from the route table in
      src/lib/routes.js. Absent is better than wrong: with no canonical declared,
      a crawler treats each URL as its own page, which is the correct answer for
      every page here. And leaving a conflicting one in the raw HTML would give
      Google two answers and let it pick.

      WHAT THIS DOES NOT FIX

      Crawlers that do not run JavaScript, which is most social previews, still
      see only the generic title and description below. A link to /finances
      shared on WhatsApp still previews as the site rather than as that page.
      Prerendering is the fix for that; a runtime tag cannot be.

      Keep the address in src/lib/routes.js in step with public/robots.txt,
      public/sitemap.xml, alert_site_url in backend/app/config.py and
      ALLOWED_ORIGINS on Cloud Run.
    -->
    <meta name="theme-color" content="#001e40" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Andhra Pradesh Fact Check" />
    <meta property="og:title" content="Andhra Pradesh Fact Check: every figure from a government document" />
    <meta
      property="og:description"
      content="Projects, finances and government commitments of Andhra Pradesh, every figure sourced from official documents. No login, six languages."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Andhra Pradesh Fact Check: every figure from a government document" />
    <meta
      name="twitter:description"
      content="Projects, finances and government commitments of Andhra Pradesh, every figure sourced from official documents."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      One Noto family per script the site is published in — but only the one the
      reader is actually using.

      This used to be a single <link> pulling all five families at four weights
      each. Every visitor downloaded Telugu, Devanagari, Tamil, Oriya AND
      Nastaliq Urdu, and an English reader used none of them: five blocking
      requests to a third-party host, on a page most people open once on a
      phone. It also made the site fragile in exactly the way that matters here
      — when Google Fonts was unreachable (a VPN extension, or an Indian ISP
      blocking fonts.gstatic.com, which is why the icon font is already
      vendored), translated pages rendered as boxes and looked untranslated.

      So the family is chosen here, inline, before first paint, from the same
      localStorage key the app uses. Latin still loads statically above because
      every page needs it. Nastaliq is its own face: Urdu is set in it because
      Naskh renders Urdu in a shape Urdu readers experience as Arabic.
    -->
    <script>
      (function () {
        var FAMILY = {
          te: 'Noto+Sans+Telugu',
          hi: 'Noto+Sans+Devanagari',
          ta: 'Noto+Sans+Tamil',
          or: 'Noto+Sans+Oriya',
          ur: 'Noto+Nastaliq+Urdu',
        }
        var lang = 'en'
        // The URL decides the language now, so the font has to be picked from
        // the URL too. A Telugu link opened fresh, with nothing in storage,
        // would otherwise paint Telugu text in a Latin fallback face before
        // React ever mounts. Storage is only the fallback, for the bare path.
        var seg = location.pathname.split('/')[1]
        if (FAMILY[seg]) {
          lang = seg
        } else {
          try { lang = localStorage.getItem('apnn.lang') || 'en' } catch (e) { /* private mode */ }
        }
        var family = FAMILY[lang]
        if (!family) return              // English needs no Indic face
        var link = document.createElement('link')
        link.rel = 'stylesheet'
        link.id = 'script-font'
        link.href = 'https://fonts.googleapis.com/css2?family=' + family +
                    ':wght@400;500;600;700&display=swap'
        document.head.appendChild(link)
      })()
    </script>
      <!-- The hero is a CSS background, so the browser only discovers it after
         the stylesheet is parsed. This tells it to start fetching immediately. -->
    <link rel="preload" as="image" href="/hero.jpg" />

    <!--
      What a reader sees while the app is still downloading.

      The prerenderer writes the page's real content inside #root, and
      createRoot replaces the whole container when React mounts. Between the
      first paint and that moment, the reader is looking at that content with
      no styles on it at all: the app's stylesheet is 55 KB and its bundle is
      420 KB, so for a second or two the homepage rendered as a bare column of
      unstyled links. It looked broken, and it got much more visible the day
      the prerendered homepage went from 324 bytes to 11 KB.

      This is NOT a loading screen hiding the content. Hiding text from readers
      while serving it to crawlers is cloaking, and this site cannot afford to
      do that even by accident. The content shown here is exactly the content
      underneath; these rules only make it legible while it is the only thing
      on screen.

      Inline rather than in the stylesheet because a stylesheet cannot style
      the paint that happens before it loads. Scoped to [data-prerender], which
      exists only in the prerendered markup, so none of it can reach React's
      DOM once the app takes over.
    -->
    <style id="prerender-paint">
      #root [data-prerender] {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 16px 64px;
        font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.6;
        color: #1a1c1f;
      }
      #root [data-prerender] h1 {
        font-size: 1.75rem; font-weight: 700; line-height: 1.15;
        letter-spacing: -0.02em; color: #001e40; margin: 0 0 12px;
      }
      #root [data-prerender] h2 {
        font-size: 1.05rem; font-weight: 600; line-height: 1.3;
        color: #001e40; margin: 28px 0 8px;
        padding-bottom: 6px; border-bottom: 1px solid #c3c6d1;
      }
      #root [data-prerender] p { margin: 0 0 12px; max-width: 62ch; }
      #root [data-prerender] ul { margin: 0 0 14px; padding: 0; list-style: none; }
      #root [data-prerender] li { margin: 0 0 4px; }
      #root [data-prerender] a { color: #1f477b; text-decoration: none; }
      #root [data-prerender] a:hover { text-decoration: underline; }
      #root [data-prerender] dl {
        display: grid; grid-template-columns: max-content 1fr;
        gap: 6px 18px; margin: 0 0 14px; font-size: 0.95rem;
      }
      #root [data-prerender] dt { color: #43474f; }
      #root [data-prerender] dd { margin: 0; }
      #root [data-prerender] table { border-collapse: collapse; font-size: 0.92rem; margin: 0 0 14px; }
      #root [data-prerender] th, #root [data-prerender] td {
        text-align: left; padding: 6px 14px 6px 0; border-bottom: 1px solid #c3c6d1;
      }
      /* One honest cue that something is still arriving. It is removed with
         the rest of the block the moment React renders. */
      #root [data-prerender]::before {
        content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, #001e40 0%, #8f4e00 50%, #001e40 100%);
        background-size: 200% 100%;
        animation: prerender-wait 1.4s linear infinite;
      }
      @keyframes prerender-wait {
        from { background-position: 100% 0; }
        to   { background-position: -100% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #root [data-prerender]::before { animation: none; background: #001e40; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
